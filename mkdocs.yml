site_name: AI Shell Documentation
site_description: An intelligent, multi-modal command-line assistant
site_url: https://gizzzmo.github.io/Ai_shell/
repo_url: https://github.com/GizzZmo/Ai_shell
repo_name: GizzZmo/Ai_shell
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Usage: USAGE.md
  - Configuration: CONFIGURATION.md
  - Architecture: ARCHITECTURE.md
  - Examples: EXAMPLES.md
  - Plugins: PLUGINS.md
  - Troubleshooting: TROUBLESHOOTING.md
  - Contributing: CONTRIBUTING.md
  - Security: SECURITY.md
  - Workflow Status: WORKFLOW_STATUS.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
